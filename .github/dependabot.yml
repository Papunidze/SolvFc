version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # vue-tsc does not support TypeScript 7 yet.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      dependencies:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [github_actions]
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
