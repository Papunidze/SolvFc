name: Stale

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v10
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: confirmed,help wanted,good first issue
          stale-issue-message: >
            This issue has had no activity for 60 days. It will be closed in 14 days
            unless there's new activity. Comment if it's still relevant.
          stale-pr-message: >
            This pull request has had no activity for 60 days. It will be closed in 14 days
            unless it's updated.
