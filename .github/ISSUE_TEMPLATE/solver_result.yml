name: Solver result
description: The solver failed, picked an invalid squad, or used cards that were too expensive
title: "[Solver]: "
labels: [solver, needs-triage]
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Before you submit
      options:
        - label: I searched existing issues and this hasn't been reported yet.
          required: true
        - label: I'm on the latest version of SolvFC.
          required: true
  - type: input
    id: sbc
    attributes:
      label: SBC name
      description: Include the group and the individual challenge
      placeholder: "Marquee Matchups — Challenge 2"
    validations:
      required: true
  - type: dropdown
    id: problem
    attributes:
      label: What went wrong?
      options:
        - No solution found, but I can build it manually
        - Squad doesn't meet the requirements
        - Squad is more expensive than it should be
        - Used cards I locked or wanted to keep
        - Other
    validations:
      required: true
  - type: textarea
    id: requirements
    attributes:
      label: SBC requirements
      description: Copy the requirement list from the challenge screen
      placeholder: |
        Min. 1 player from: Premier League
        Team rating: min. 84
        Squad chemistry: min. 25
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What did the solver produce, and what did you expect? Screenshots help a lot.
    validations:
      required: true
  - type: input
    id: extension-version
    attributes:
      label: Extension version
      placeholder: 0.1.0
    validations:
      required: true
  - type: textarea
    id: settings
    attributes:
      label: Relevant settings
      description: Anything you changed in the options page (weights, untradeables only, etc.)
